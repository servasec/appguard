services:
  frontend:
    container_name: frontend
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      no_cache: true
    environment:
      - INTERNAL_API_URL=http://backend:8080
      - NODE_ENV=development
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      public:

  backend:
    container_name: backend
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
      args:
        BUILD_TAGS: ${BUILD_TAGS:-}
        GIT_VERSION: ${GIT_VERSION:-develop}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable'
      APPGUARD_SEED_DATABASE: ${APPGUARD_SEED_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      APPGUARD_SITE_NAME: ${APPGUARD_SITE_NAME}
      APPGUARD_PUBLIC_URL: ${APPGUARD_PUBLIC_URL}
      APPGUARD_REGISTRATION_ENABLED: ${APPGUARD_REGISTRATION_ENABLED}
      APPGUARD_DEBUG_ENABLED: ${APPGUARD_DEBUG_ENABLED:-false}
      APPGUARD_ADMIN_PASSWORD: ${APPGUARD_ADMIN_PASSWORD}
      APPGUARD_LICENSE_KEY: ${APPGUARD_LICENSE_KEY:-}
      APPGUARD_API_PREFIX: /api
      APPGUARD_FEATURES_ENCRYPTION_KEY: ${APPGUARD_FEATURES_ENCRYPTION_KEY}
      BUILD_TAGS: ${BUILD_TAGS:-}
      SSO_GITHUB_CLIENT_ID: ${SSO_GITHUB_CLIENT_ID:-}
      SSO_GITHUB_CLIENT_SECRET: ${SSO_GITHUB_CLIENT_SECRET:-}
      SSO_GITLAB_CLIENT_ID: ${SSO_GITLAB_CLIENT_ID:-}
      SSO_GITLAB_CLIENT_SECRET: ${SSO_GITLAB_CLIENT_SECRET:-}
      SSO_GITLAB_BASE_URL: ${SSO_GITLAB_BASE_URL:-}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_ISSUER_URL: ${SSO_OIDC_ISSUER_URL:-}
      SSO_OIDC_SCOPES: ${SSO_OIDC_SCOPES:-}
    volumes:
      - ./backend:/app
    networks:
      public:
      private:

  db:
    container_name: db
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:54322:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      private:

  caddy:
    container_name: caddy
    hostname: appguard.local
    build:
      context: caddy/
      dockerfile: Dockerfile
    environment:
      - APPGUARD_PUBLIC_DOMAIN=${APPGUARD_PUBLIC_DOMAIN}
    ports:
      - "8080:80"
      - "443:443"
    networks:
      public:
      private:

networks:
  public:
    driver: bridge
    ipam:
      config:
        - subnet: 172.70.1.0/24
  private:
    driver: bridge
    ipam:
      config:
        - subnet: 172.70.2.0/24
