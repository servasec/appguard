services:
  frontend:
    container_name: ${APPGUARD_CONTAINER_PREFIX:-${SSC_CONTAINER_PREFIX:-}}frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: registry.gitlab.com/servasec/appguard/frontend:${APPGUARD_IMAGE_TAG:-${SSC_IMAGE_TAG:-latest}}
    environment:
      - INTERNAL_API_URL=http://backend:8080
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      public:

  backend:
    container_name: ${APPGUARD_CONTAINER_PREFIX:-${SSC_CONTAINER_PREFIX:-}}backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: ${APPGUARD_BACKEND_IMAGE:-registry.gitlab.com/servasec/appguard/backend}:${APPGUARD_IMAGE_TAG:-${SSC_IMAGE_TAG:-latest}}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable'
      APPGUARD_SEED_DATABASE: ${APPGUARD_SEED_DATABASE:-${SSC_SEED_DATABASE:-false}}
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      APPGUARD_SITE_NAME: ${APPGUARD_SITE_NAME:-${SSC_SITE_NAME:-appguard}}
      APPGUARD_PUBLIC_URL: ${APPGUARD_PUBLIC_URL:-${SSC_PUBLIC_URL:-}}
      APPGUARD_REGISTRATION_ENABLED: ${APPGUARD_REGISTRATION_ENABLED:-${SSC_REGISTRATION_ENABLED:-false}}
      APPGUARD_DEBUG_ENABLED: ${APPGUARD_DEBUG_ENABLED:-${SSC_DEBUG_ENABLED:-false}}
      APPGUARD_ADMIN_PASSWORD: ${APPGUARD_ADMIN_PASSWORD:-${SSC_ADMIN_PASSWORD:-}}
      APPGUARD_LICENSE_KEY: ${APPGUARD_LICENSE_KEY:-${SSC_LICENSE_KEY:-}}
      APPGUARD_API_PREFIX: /api
      APPGUARD_FEATURES_ENCRYPTION_KEY: ${APPGUARD_FEATURES_ENCRYPTION_KEY:-${SSC_FEATURES_ENCRYPTION_KEY:-}}
      TRUSTED_PROXIES_CIDR: ${TRUSTED_PROXIES_CIDR:-}
      SSO_GITHUB_CLIENT_ID: ${SSO_GITHUB_CLIENT_ID:-}
      SSO_GITHUB_CLIENT_SECRET: ${SSO_GITHUB_CLIENT_SECRET:-}
      SSO_GITLAB_CLIENT_ID: ${SSO_GITLAB_CLIENT_ID:-}
      SSO_GITLAB_CLIENT_SECRET: ${SSO_GITLAB_CLIENT_SECRET:-}
      SSO_GITLAB_BASE_URL: ${SSO_GITLAB_BASE_URL:-}
      SSO_OIDC_CLIENT_ID: ${SSO_OIDC_CLIENT_ID:-}
      SSO_OIDC_CLIENT_SECRET: ${SSO_OIDC_CLIENT_SECRET:-}
      SSO_OIDC_ISSUER_URL: ${SSO_OIDC_ISSUER_URL:-}
      SSO_OIDC_SCOPES: ${SSO_OIDC_SCOPES:-}
    networks:
      public:
      private:

  db:
    container_name: ${APPGUARD_CONTAINER_PREFIX:-${SSC_CONTAINER_PREFIX:-}}db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    image: postgres:${POSTGRES_VERSION:-17}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      private:

  caddy:
    container_name: ${APPGUARD_CONTAINER_PREFIX:-${SSC_CONTAINER_PREFIX:-}}caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    hostname: ${APPGUARD_PUBLIC_DOMAIN:-${SSC_PUBLIC_DOMAIN:-appguard.local}}
    image: registry.gitlab.com/servasec/appguard/caddy:${APPGUARD_IMAGE_TAG:-${SSC_IMAGE_TAG:-latest}}
    environment:
      - APPGUARD_PUBLIC_DOMAIN=${APPGUARD_PUBLIC_DOMAIN:-${SSC_PUBLIC_DOMAIN:-}}
      - APPGUARD_EDGE_MODE=${APPGUARD_EDGE_MODE:-${SSC_EDGE_MODE:-false}}
    ports:
      - "${CADDY_HTTP_BIND:-0.0.0.0:80}:80"
      - "${CADDY_HTTPS_BIND:-0.0.0.0:443}:443"
    volumes:
      - caddy_data:/data
    networks:
      public:
      private:

volumes:
  postgres_data:
  caddy_data:

networks:
  public:
    driver: bridge
    ipam:
      config:
        - subnet: ${APPGUARD_NETWORK_PUBLIC_SUBNET:-${SSC_NETWORK_PUBLIC_SUBNET:-172.70.1.0/24}}
  private:
    driver: bridge
    ipam:
      config:
        - subnet: ${APPGUARD_NETWORK_PRIVATE_SUBNET:-${SSC_NETWORK_PRIVATE_SUBNET:-172.70.2.0/24}}
