name: Security Reports

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Opengrep
        run: |
          curl -fsSL https://github.com/opengrep/opengrep/releases/download/v1.30.0/opengrep_manylinux_x86 -o /tmp/opengrep
          echo '35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c  /tmp/opengrep' | sha256sum --check
          install -m 0755 /tmp/opengrep /usr/local/bin/opengrep

      - name: Opengrep - JSON report
        run: |
          opengrep scan --config p/security-audit \
            --output=opengrep-report.json \
            --json \
            --exclude=node_modules \
            --exclude=vendor \
            backend/ frontend/

      - name: Opengrep - SARIF report
        run: |
          opengrep scan --config p/security-audit \
            --output=opengrep-report.sarif \
            --sarif \
            --exclude=node_modules \
            --exclude=vendor \
            backend/ frontend/

      - name: Upload Opengrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: opengrep-report.sarif

      - name: Trivy - JSON report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy - SARIF report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-report.sarif
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-report.sarif

      - name: Attach JSON reports to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            opengrep-report.json
            trivy-report.json
