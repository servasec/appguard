apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appguard.fullname" . }}
  labels:
    {{- include "appguard.labels" . | nindent 4 }}
data:
  APPGUARD_SITE_NAME: {{ .Values.config.siteName | quote }}
  APPGUARD_PUBLIC_URL: {{ required "domain.publicUrl must be your public HTTPS URL" .Values.domain.publicUrl | quote }}
  APPGUARD_REGISTRATION_ENABLED: {{ .Values.config.registrationEnabled | quote }}
  APPGUARD_DEBUG_ENABLED: {{ .Values.config.debugEnabled | quote }}
  APPGUARD_API_PREFIX: {{ .Values.config.apiPrefix | quote }}
  TRUSTED_PROXIES_CIDR: {{ .Values.config.trustedProxiesCidr | quote }}
  INTERNAL_API_URL: http://{{ include "appguard.backendName" . }}:8080
  NODE_ENV: "production"
