apiVersion: v1
kind: Secret
metadata:
  name: {{ include "appguard.fullname" . }}
  labels:
    {{- include "appguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.user | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" (.Values.secrets.postgresPassword | default .Values.postgresql.password) | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  REFRESH_SECRET: {{ required "secrets.refreshSecret is required" .Values.secrets.refreshSecret | quote }}
  CSRF_SECRET: {{ required "secrets.csrfSecret is required" .Values.secrets.csrfSecret | quote }}
  APPGUARD_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  APPGUARD_FEATURES_ENCRYPTION_KEY: {{ required "secrets.encryptionKey is required" .Values.secrets.encryptionKey | quote }}
  APPGUARD_LICENSE_KEY: {{ .Values.secrets.licenseKey | quote }}
  APPGUARD_LICENSE_PUBLIC_KEY_HEX: {{ .Values.secrets.licensePublicKey | quote }}
  SSO_GITHUB_CLIENT_ID: {{ .Values.secrets.sso.githubClientId | quote }}
  SSO_GITHUB_CLIENT_SECRET: {{ .Values.secrets.sso.githubClientSecret | quote }}
  SSO_GITLAB_CLIENT_ID: {{ .Values.secrets.sso.gitlabClientId | quote }}
  SSO_GITLAB_CLIENT_SECRET: {{ .Values.secrets.sso.gitlabClientSecret | quote }}
  SSO_GITLAB_BASE_URL: {{ .Values.secrets.sso.gitlabBaseUrl | quote }}
  SSO_OIDC_CLIENT_ID: {{ .Values.secrets.sso.oidcClientId | quote }}
  SSO_OIDC_CLIENT_SECRET: {{ .Values.secrets.sso.oidcClientSecret | quote }}
  SSO_OIDC_ISSUER_URL: {{ .Values.secrets.sso.oidcIssuerUrl | quote }}
  SSO_OIDC_SCOPES: {{ .Values.secrets.sso.oidcScopes | quote }}
