{{- if gt (int .Values.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "appguard.backendName" . }}
  labels:
    {{- include "appguard.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "appguard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
{{- end }}
