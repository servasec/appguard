# CI-only values. Never use these credentials for a real installation.

replicaCount: 1

imagePullSecrets: []

image:
  backend:
    repository: registry.gitlab.com/servasec/appguard/backend
    tag: ""
    pullPolicy: IfNotPresent
  frontend:
    repository: registry.gitlab.com/servasec/appguard/frontend
    tag: ""
    pullPolicy: IfNotPresent

domain:
  name: appguard.test
  publicUrl: "https://appguard.test"

config:
  siteName: appguard
  registrationEnabled: false
  debugEnabled: false
  apiPrefix: /api
  trustedProxiesCidr: "10.0.0.0/8"

ingress:
  traefik:
    enabled: true
    certResolver: "letsencrypt"
    tlsSecretName: ""
    entryPoints:
      - websecure

postgresql:
  internal: true
  image: postgres:17
  database: appguard-db
  user: appguard
  password: ""
  externalUrl: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

secrets:
  postgresPassword: "test-only-postgres-password-do-not-deploy-0001"
  jwtSecret: "test-only-jwt-secret-do-not-deploy-000000000001"
  refreshSecret: "test-only-refresh-secret-do-not-deploy-0000001"
  csrfSecret: "test-only-csrf-secret-do-not-deploy-000000001"
  encryptionKey: "test-only-encryption-key-do-not-deploy-00000001"
  adminPassword: "test-only-admin-password-do-not-deploy-0000001"
  licenseKey: ""
  sso:
    githubClientId: ""
    githubClientSecret: ""
    gitlabClientId: ""
    gitlabClientSecret: ""
    gitlabBaseUrl: ""
    oidcClientId: ""
    oidcClientSecret: ""
    oidcIssuerUrl: ""
    oidcScopes: "openid profile email"

resources:
  backend:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

autoscaling:
  enabled: false

networkPolicy:
  enabled: false
